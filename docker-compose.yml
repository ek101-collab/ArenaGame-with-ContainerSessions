version: '3.8'

services:
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile_Godot
    ports:
      - "8080:80"

  matchmaker:
    build: 
      context: ./backend/matchmaker
      dockerfile: Dockerfile_matchmaker
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock