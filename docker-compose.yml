version: '3.8'

services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./GameExport:/usr/share/nginx/html:ro
      - ./GameExport/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  matchmaker:
    build: 
      context: ./backend/matchmaker
      dockerfile: Dockerfile_matchmaker
    ports:
      - "8001:8001"
    environment:
      - SERVER_IP=46.101.127.20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock