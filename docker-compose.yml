services:
  frontend:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./GameExport:/usr/share/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - caddy_net
    restart: always

  matchmaker:
    build: ./backend/matchmaker
    networks:
      - caddy_net
    restart: always

networks:
  caddy_net:
    driver: bridge